<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil's HealthCare - Create Account</title>
   <meta name="description" content="">
  <meta name="keywords" content="">

  <link href="assets/img/lil.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #19cc73;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .main-container {
            width: 100%;
            max-width: 700px;
            min-height: 700px;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(59, 130, 246, 0.15);
            display: flex;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(59, 130, 246, 0.1);
        }

        /* Left Section - Sign Up Form */
        .signup-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            color: #1e293b;
            position: relative;
            overflow-y: auto;
        }

        .logo-section {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #19cc73 0%, #14a35c 100%);
            border-radius: 8px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo::before {
            content: '+';
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #19cc73;
            text-align: center;
            
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            flex: 1;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.1);
        }

        .signup-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
            color: #19cc73;
        }

        .signup-subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        .form-group.full-width {
            flex: none;
            width: 100%;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
            color: #1f2937;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #19cc73;
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: #ffffff;
            color: #1f2937;
        }

        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 14px;
        }

        .password-toggle:hover {
            color: #08c508;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .strength-bar {
            height: 4px;
            width: 20px;
            background: #e5e7eb;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .strength-bar.weak { background: #ef4444; }
        .strength-bar.medium { background: #f59e0b; }
        .strength-bar.strong { background: #10b981; }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #08e617;
            margin-top: 2px;
        }

        .checkbox-group label {
            color: #4b5563;
            flex: 1;
        }

        .checkbox-group a {
            color: #0c4629;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #08a556 0%, #19cc73 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .signup-btn:hover {
            background: linear-gradient(135deg, #19cc73 0%, #19cc73 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .signup-btn .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .login-link a {
            color: #19cc73;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Right Section - Hero Content */
        .hero-section {
            flex: 1.2;
            background: linear-gradient(135deg, #19cc73 0%, #19cc73 50%, #19cc73 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #38e311;
        }

        .hero-content {
            text-align: center;
            z-index: 2;
            color: white;
        }

        .doctor-placeholder {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .customers-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 12px;
            color: #19cc73;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: inline-block;
        }

        .customer-avatars {
            display: flex;
            gap: -8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            margin-left: -8px;
        }

        .avatar:nth-child(1) { background: #09fe1e; }
        .avatar:nth-child(2) { background: #3ade08; }
        .avatar:nth-child(3) { background: #33cd04; }
        .avatar:nth-child(4) { background: #3ae108; }

        .connect-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .connect-subtext {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .benefits-list {
            text-align: left;
            max-width: 280px;
            margin: 0 auto;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: white;
            font-size: 14px;
        }

        .benefit-icon {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #19cc73;
            background: white;
        }

        .geometric-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: float 6s ease-in-out infinite;
        }

        .shape-2 {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 12px;
            top: 70%;
            right: 20%;
            animation: float 4s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            background: white;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            bottom: 20%;
            left: 20%;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                width: 100%;
                border-radius: 0;
            }

            .signup-section, .hero-section {
                flex: none;
            }

            .signup-section {
                order: 2;
                padding: 30px 20px;
            }

            .hero-section {
                order: 1;
                min-height: 300px;
            }

            .doctor-placeholder {
                width: 150px;
                height: 150px;
                font-size: 36px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 24px;
            }
            
            .logo-section {
                margin-bottom: 20px;
            }
            
            .brand-name {
                font-size: 20px;
            }

            .signup-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sign Up Section -->
        <div class="signup-section">
            <div class="logo-section">
                <div class="logo"></div>
                <h1 class="brand-name">Lil's Healthcare</h1>
            </div>

            <div class="signup-card">
                <h2 class="signup-title">Create Account</h2>
                <p class="signup-subtitle">Join thousands of patients who trust Lil's Healthcare for their medical needs</p>
                
                <form id="signupForm" action="signup.php" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-input" name="first_name" placeholder="--Enter First Name--" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-input" name="last_name" placeholder="--Enter Last Name--" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" name="email" placeholder="Bigmike02@gmail.com" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-input" name="phone" placeholder="+233 27 422 8833" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-input" name="date_of_birth" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <select class="form-select" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Patient Type</label>
                            <select class="form-select" name="patient_type" required>
                                <option value="">Select Type</option>
                                <option value="individual">Individual</option>
                                <option value="family_plan">Family Plan</option>
                                <option value="corporate">Corporate</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-input" name="address" placeholder="Accra-Tema, Ghana, State 12345" required>
                    </div>

                    <div class="form-group full-width password-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" name="password" placeholder="Create a strong password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
                        <div class="password-strength">
                            <div class="strength-bar" id="strength1"></div>
                            <div class="strength-bar" id="strength2"></div>
                            <div class="strength-bar" id="strength3"></div>
                            <div class="strength-bar" id="strength4"></div>
                            <span id="strengthText">Password strength</span>
                        </div>
                    </div>

                    <div class="form-group full-width password-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-input" name="confirmPassword" placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>

                    <!--<div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a></label>
                    </div>-->

                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">I want to receive health tips and updates via email</label>
                    </div>

                    <input type="submit" value="Create Account" class="signup-btn"> 
                </form>

                <div class="login-link">
                    Already have an account? <a href="login.html" onclick="goToLogin()">Sign In</a>
                </div>
            </div>
        </div>

          
    <script>
        // Password toggle functionality
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleBtn = passwordInput.nextElementSibling;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            updatePasswordStrength(strength);
        });

        function checkPasswordStrength(password) {
            let score = 0;
            const checks = [
                password.length >= 8,
                /[a-z]/.test(password),
                /[A-Z]/.test(password),
                /[0-9]/.test(password),
                /[^A-Za-z0-9]/.test(password)
            ];
            
            score = checks.filter(Boolean).length;
            
            if (score < 3) return 'weak';
            if (score < 5) return 'medium';
            return 'strong';
        }

        function updatePasswordStrength(strength) {
            const bars = document.querySelectorAll('.strength-bar');
            const text = document.getElementById('strengthText');
            
            bars.forEach(bar => bar.className = 'strength-bar');
            
            switch (strength) {
                case 'weak':
                    bars[0].classList.add('weak');
                    text.textContent = 'Weak password';
                    break;
                case 'medium':
                    bars[0].classList.add('medium');
                    bars[1].classList.add('medium');
                    bars[2].classList.add('medium');
                    text.textContent = 'Medium strength';
                    break;
                case 'strong':
                    bars.forEach(bar => bar.classList.add('strong'));
                    text.textContent = 'Strong password';
                    break;
            }
        }

        // COMPLETELY REMOVE form event listener to allow normal submission

        // Navigate to login page
        function goToLogin() {
            // In a real application, this would navigate to the login page
            showNotification('Redirecting to login page...', 'info');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        // Notification system
        function showNotification(message, type) {
            // Remove existing notifications
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) {
                existingNotification.remove();
            }

            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 16px 24px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
                max-width: 350px;
                box-shadow: 0 8px 16px rgba(0,0,0,0.2);
                ${type === 'success' ? 'background: #10b981;' : 
                  type === 'error' ? 'background: #ef4444;' : 
                  'background: #3b82f6;'}
            `;
            notification.textContent = message;

            document.body.appendChild(notification);

            // Auto remove after 5 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        // Add notification animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Add interactive effects
        document.querySelectorAll('.form-input, .form-select').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 8px 16px rgba(59, 130, 246, 0.15)';
            });

            input.addEventListener('blur', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = 'none';
            });
        });

        // Phone number formatting
        document.querySelector('input[name="phone"]').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 10) {
                value = value.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3');
            }
            e.target.value = value;
        });

        // Email validation
        document.querySelector('input[name="email"]').addEventListener('blur', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email && !emailRegex.test(email)) {
                this.style.borderColor = '#ef4444';
                showNotification('Please enter a valid email address', 'error');
            } else {
                this.style.borderColor = '#d1d5db';
            }
        });
    </script>
</body>
</html>
